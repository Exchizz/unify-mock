services:
  unifi-controller:
    build: .
    # Published by .github/workflows/docker-build.yml. GHCR requires a
    # lowercase path, so Exchizz/unify-mock becomes exchizz/unify-mock.
    # With `build:` present, `docker compose up` builds locally and tags
    # this name; use `docker compose pull` to fetch the published image
    # instead.
    image: ghcr.io/exchizz/unify-mock:latest
    container_name: unifi-controller
    restart: unless-stopped
    # Host networking is strongly recommended: the camera dials this
    # container's IP directly (TLS control channel + raw TCP media push),
    # and go2rtc/Frigate on this same host pull the FLV output over
    # 127.0.0.1. Bridge networking would require extra NAT/hairpin config
    # for the camera-initiated connections.
    network_mode: host
    environment:
      # Required: an address the camera can resolve/reach — this host's
      # LAN IP, or a hostname if the camera has working DNS. The camera is
      # told to dial this address back for its media (FLV) push after
      # adoption.
      CONTROLLER_HOST: "192.168.1.2"
      # Where the MAC -> port-index map is written. Must point into the
      # mounted volume below, otherwise it lands in the container's
      # ephemeral filesystem and cameras are re-indexed (and change ports)
      # every time the container is recreated.
      STATE_FILE: "/data/cameras.json"
      # Optional overrides (defaults shown):
      # LISTEN_PORT: "18080"
      # WEB_PORT: "18081"          # status page: http://<host>:18081
      # WEB_HOST: "0.0.0.0"        # set 127.0.0.1 to keep the page off the LAN
      # MEDIA_PORT_BASE: "7550"
      # FLV_PORT_BASE: "7650"
      # STREAM_IDLE_TIMEOUT: "10"
      # DEVICE_TIMEZONE: "Europe/Copenhagen"   # IANA name, not a POSIX TZ string
      CERT_DIR: "/certs"
    volumes:
      - ./certs:/certs
      # Persists the MAC -> port-index map, so each camera keeps the same
      # media/FLV ports across restarts (your go2rtc config references
      # them by number).
      - camera-state:/data

volumes:
  camera-state:

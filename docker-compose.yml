services:
  unifi-controller:
    build: .
    image: ghcr.io/OWNER/REPO:latest
    container_name: unifi-controller
    restart: unless-stopped
    # Host networking is strongly recommended: the camera dials this
    # container's IP directly (TLS control channel + raw TCP media push),
    # and go2rtc/Frigate on this same host pull the FLV output over
    # 127.0.0.1. Bridge networking would require extra NAT/hairpin config
    # for the camera-initiated connections.
    network_mode: host
    environment:
      # Required: an address the camera can resolve/reach — this host's
      # LAN IP, or a hostname if the camera has working DNS. The camera is
      # told to dial this address back for its media (FLV) push after
      # adoption.
      CONTROLLER_HOST: "192.168.1.2"
      # Optional overrides (defaults shown):
      # LISTEN_PORT: "18080"
      # MEDIA_PORT_BASE: "7550"
      # FLV_PORT_BASE: "7650"
      # STATE_FILE: "/data/cameras.json"
      # DEVICE_TIMEZONE: "CET-1CEST,M3.5.0,M10.5.0/3"
      CERT_DIR: "/certs"
    volumes:
      - ./certs:/certs
      # Persists the MAC -> port-index map, so each camera keeps the same
      # media/FLV ports across restarts (your go2rtc config references
      # them by number).
      - camera-state:/data

volumes:
  camera-state:
